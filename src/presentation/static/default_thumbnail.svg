<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg)" rx="8" ry="8"/>
  
  <!-- Icon container -->
  <g transform="translate(150, 100)">
    <!-- Camera icon -->
    <rect x="-25" y="-15" width="50" height="40" rx="5" fill="#6c757d" opacity="0.3"/>
    <circle cx="0" cy="-5" r="8" fill="#6c757d" opacity="0.3"/>
    <rect x="-20" y="-10" width="40" height="30" rx="3" fill="#6c757d" opacity="0.2"/>
    <circle cx="0" cy="0" r="12" fill="#6c757d" opacity="0.4"/>
    <circle cx="0" cy="0" r="8" fill="#6c757d" opacity="0.6"/>
    
    <!-- Photo lines -->
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#6c757d" stroke-width="1" opacity="0.5"/>
    <line x1="-6" y1="-4" x2="6" y2="-4" stroke="#6c757d" stroke-width="1" opacity="0.5"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#6c757d" stroke-width="1" opacity="0.5"/>
    <line x1="-6" y1="4" x2="6" y2="4" stroke="#6c757d" stroke-width="1" opacity="0.5"/>
    <line x1="-8" y1="8" x2="8" y2="8" stroke="#6c757d" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" opacity="0.7">
    Sem imagens
  </text>
</svg> 